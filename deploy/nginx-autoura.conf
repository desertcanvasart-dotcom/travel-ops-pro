# /etc/nginx/sites-available/autoura  (symlink into sites-enabled)
#
# Nginx in front of Autoura: HTTPS on 443, HTTP on 80 redirected to it, and
# everything proxied to the app on 127.0.0.1:3000 (deploy/autoura.service).
# Install steps are in docs/SELF-HOSTING.md → "Nginx and HTTPS".
#
# Replace every  autoura.example.com  below with the real hostname (the same
# host as NEXT_PUBLIC_APP_URL in .env.local).
#
# Written for the Nginx that Ubuntu ships (1.18 on 22.04, 1.24 on 24.04).
# The "listen [::]" lines assume the server has IPv6; delete them if nginx -t
# reports "Address family not supported".
#
# What is deliberately NOT here:
#   - Security headers (HSTS, CSP, X-Frame-Options, …) and gzip — the app
#     already sends them (next.config.ts). Adding them here would send each
#     header twice, and compress twice.
#   - Static-file caching — Next sets the cache headers on /_next/static itself.

upstream autoura_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Anything that does not name our host is dropped, so the app never sees a
# forged Host header or a scanner hitting the bare IP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# HTTP → HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name autoura.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name autoura.example.com;

    # Let's Encrypt (certbot) — see SELF-HOSTING.md for issuing and renewal.
    ssl_certificate     /etc/letsencrypt/live/autoura.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autoura.example.com/privkey.pem;

    # Mozilla "intermediate" profile.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # The largest upload is 50 MB in total (AI file parsing, several files at
    # once — app/api/ai/parse-file). A little headroom for form encoding.
    client_max_body_size 55m;

    location / {
        proxy_pass http://autoura_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # OVERWRITTEN with the connecting address, never passed through: rate
        # limits and the audit trail trust X-Real-IP (lib/client-ip.ts), so a
        # client must not be able to set it. If Cloudflare or another proxy is
        # ever put in front of this server, use the realip module instead.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        # AI file parsing may run 120 s and PDF renders can be slow; the
        # default 60 s would cut them off with a 504.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
