# Railway configuration.
#
# Build & deploy are intentionally OMITTED so the existing Railway (dashboard)
# settings keep applying unchanged.
#
# Scheduled jobs are NOT configured here. Railway's only cron key is
# `deploy.cronSchedule`, which runs a service's START COMMAND on a schedule —
# i.e. a separate cron service — and it does not read `[[cron]]` tables (the
# ones that used to live in this file never fired). The jobs run in-process
# instead: see instrumentation.ts → lib/cron/scheduler.ts, which ticks every
# minute inside the web container and claims each slot in cron_locks. The
# registry there is the single source of truth for schedules:
#   rate-change-digest   */15 * * * *
#   process-agent-memory 0 2 * * *     (02:00 UTC)
#   data-invariants      15 3 * * *    (03:15 UTC)
# Needs CRON_SECRET (bearer the routes check) and RAILWAY_SERVICE_NAME (set by
# Railway) or CRON_IN_PROCESS=true; CRON_IN_PROCESS=false disarms.
