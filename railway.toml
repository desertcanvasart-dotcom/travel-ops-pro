# Railway configuration — adds the agent-memory feedback-loop cron job.
#
# Build & deploy are intentionally OMITTED so your existing Railway (dashboard)
# settings keep applying unchanged — this file only adds the scheduled job.
# If your deploy is fully dashboard-managed and you'd rather not introduce a
# railway.toml, add the same cron via Railway → service → Settings → Cron and
# delete this file.
#
# Uses the service's existing NEXT_PUBLIC_APP_URL (full https URL of the app)
# and CRON_SECRET. The endpoint is a GET that checks
# `Authorization: Bearer $CRON_SECRET` — note the route only ENFORCES that
# header when CRON_SECRET is set; if it's unset the endpoint is unauthenticated.

[[cron]]
schedule = "0 2 * * *"   # nightly at 02:00 UTC
command = "curl -fsS -X GET \"$NEXT_PUBLIC_APP_URL/api/cron/process-agent-memory\" -H \"Authorization: Bearer $CRON_SECRET\""

# Nightly data-integrity sweep (see app/api/cron/data-invariants/route.ts):
# 12 invariant checks over itineraries/invoices/rates; violations alert
# BUSINESS_EMAIL. Curl's -f makes a non-2xx exit non-zero for Railway's cron
# logs, but note the endpoint intentionally returns 200 with ok:false for
# DATA violations (email is the alert channel) — -f only catches infra
# failures (500s / unreachable).
[[cron]]
schedule = "15 3 * * *"  # nightly at 03:15 UTC
command = "curl -fsS -X GET \"$NEXT_PUBLIC_APP_URL/api/cron/data-invariants\" -H \"Authorization: Bearer $CRON_SECRET\""

# Rate-change digest (see app/api/cron/rate-change-digest/route.ts): tells
# owners/admins/managers what changed in the rate tables since the last run,
# one notification per editor × table. Reads the trigger-written audit log,
# so imports and SQL-editor edits are covered too.
[[cron]]
schedule = "*/15 * * * *"
command = "curl -fsS -X GET \"$NEXT_PUBLIC_APP_URL/api/cron/rate-change-digest\" -H \"Authorization: Bearer $CRON_SECRET\""
