name: CI

# Enforces the pricing harness (and the rest of the codebase) on every PR:
# the test suite, a strict type-check and a real production build must all
# pass before merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + type-check
    runs-on: ubuntu-latest
    env:
      # Tests/tsc don't use Puppeteer's bundled browser — skip the slow download.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      - name: Generate Next route types
        # `next typegen` produces .next/types without a build (no env vars, no
        # prerender), which is all the full type-check needs on a fresh checkout.
        run: npx next typegen

      - name: Type-check (full app)
        # FULL tsc, not a scoped subset. The previous scoped check
        # (tsconfig.ci.json, 8 pricing files) let an app-code type error merge
        # with green CI while `tsc --noEmit` was broken on main — this closes
        # that class permanently.
        run: NODE_OPTIONS=--max-old-space-size=4096 npx tsc --noEmit

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      # `next build` is the only check that catches build-time-only failures:
      # a client component calling useSearchParams() without a Suspense
      # boundary type-checks and tests green, then fails prerender. That
      # exact bug reached Railway and broke a deploy — this job moves the
      # failure back to PR time.
      #
      # Placeholders, not secrets: the build evaluates module-scope Supabase
      # clients (which throw on undefined env) but makes no network calls, so
      # a fake URL/key is enough. Keeping real secrets out means this job also
      # runs on fork PRs, where the E2E job has to skip.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      # Same memory headroom the type-check needs; the default heap OOMs.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (next build)
        run: npm run build

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Stamps everything this run creates, so a concurrent run (another job,
      # or a developer running the suite locally against the same project)
      # cannot delete fixtures out from under it. See e2e/fixtures.ts.
      E2E_RUN_ID: ${{ github.run_id }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Secrets are absent on fork PRs — skip cleanly instead of failing on a
      # server that can't boot. The gate step decides once; later steps honor it.
      - name: Check secrets availability
        id: gate
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E skipped — Supabase secrets unavailable (fork PR?)"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke suite
        if: steps.gate.outputs.run == 'true'
        # Boots its own next dev on :3100 (playwright.config.ts webServer) and
        # runs both tiers against the live Supabase project: 13 journeys incl.
        # the Edit-page regression test and the RLS exposure probe. Reads-only
        # against the seeded E2E org (npm run seed:e2e fixtures).
        run: npx playwright test

      - name: Upload Playwright report
        if: steps.gate.outputs.run == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
